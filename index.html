<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evenly</title>
  <meta name="description" content="Split it. Settle it. Cuentas claras entre grupos.">
  <meta name="theme-color" content="#0ea371">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230ea371'/%3E%3Crect x='8' y='11' width='16' height='3.2' rx='1.6' fill='%23fff'/%3E%3Crect x='8' y='17.8' width='16' height='3.2' rx='1.6' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="boot" class="center-screen"><div class="spinner" aria-label="Cargando"></div></div>

  <section id="login-view" class="center-screen" hidden>
    <div class="login-card">
      <div class="brand brand-lg">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><rect x="8" y="11" width="16" height="3.2" rx="1.6" fill="#fff"/><rect x="8" y="17.8" width="16" height="3.2" rx="1.6" fill="#fff"/></svg>
        <span>Evenly</span>
      </div>
      <h1 class="login-title">Split it. Settle it.</h1>
      <p class="muted">Anota los gastos compartidos de tu grupo y mira al tiro quién le debe cuánto a quién.</p>
      <button id="login-btn" class="btn primary btn-block">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.98h5.35c-.23 1.4-1.66 4.1-5.35 4.1-3.22 0-5.85-2.67-5.85-5.96S8.78 6.26 12 6.26c1.83 0 3.06.78 3.76 1.45l2.57-2.47C16.68 3.7 14.55 2.75 12 2.75 6.9 2.75 2.75 6.9 2.75 12s4.15 9.25 9.25 9.25c5.34 0 8.88-3.75 8.88-9.04 0-.6-.07-1.06-.15-1.51z"/></svg>
        Continuar con Google
      </button>
      <p id="login-error" class="form-error"></p>
    </div>
  </section>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="#/" class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><rect x="8" y="11" width="16" height="3.2" rx="1.6" fill="#fff"/><rect x="8" y="17.8" width="16" height="3.2" rx="1.6" fill="#fff"/></svg>
          <span>Evenly</span>
        </a>
        <div class="user">
          <img id="user-photo" class="user-photo" alt="" referrerpolicy="no-referrer" hidden>
          <span id="user-email" class="user-email muted"></span>
          <button id="logout-btn" class="btn ghost sm">Salir</button>
        </div>
      </div>
    </header>
    <main id="main" class="container"></main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
